[package]
name = "bollard-stubs"
version = "1.57.0-rc.29.10.0"
authors = [ "Bollard contributors" ]
description = "Stubs used for the Bollard rust async Docker client API"
license = "Apache-2.0"
homepage = "https://github.com/fussybeaver/bollard"
repository = "https://github.com/fussybeaver/bollard"
documentation = "https://docs.rs/bollard-stubs"
edition = "2021"

[features]
buildkit = ["base64", "bytes", "bollard-buildkit-proto", "prost"]

[dependencies]
base64 = { version = "0.23", optional = true }
bollard-buildkit-proto = { version = "0.10.0", path = "../proto", optional = true }
bytes = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = { version = "0.14", optional = true }
time = { version = "0.3", features = ["formatting", "parsing"], optional = true }

serde_repr = "0.1"
