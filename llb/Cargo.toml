[package]
name = "bollard-llb"
description = "Low-Level Builder (LLB) graph construction for Bollard/BuildKit"
version = "0.1.0"
authors = [ "Bollard contributors" ]
license = "Apache-2.0"
homepage = "https://github.com/fussybeaver/bollard"
repository = "https://github.com/fussybeaver/bollard"
documentation = "https://docs.rs/bollard-llb"
edition = "2021"

[features]
dump_json = ["dep:serde_json"]

[dependencies]
bollard-buildkit-proto = { path = "../codegen/proto", default-features = false }
hex = "0.4"
indexmap = "2"
prost = "0.14"
serde_json = { version = "1", optional = true }
sha2 = "0.10"
shlex = "1"
thiserror = "2"
