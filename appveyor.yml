image: Visual Studio 2017

install:
  - docker version
  - appveyor DownloadFile https://win.rustup.rs/ -FileName rustup-init.exe
  - rustup-init -yv --default-toolchain stable --default-host x86_64-pc-windows-msvc
  - set PATH=%PATH%;%USERPROFILE%\.cargo\bin
  - rustc -V
  - cargo -V

build_script:
  - ver
  - ps: systeminfo /fo csv | ConvertFrom-Csv | select OS*, System*, Hotfix* | Format-List
  - ps: Get-VMNetworkAdapter -VMName *
  - ps: Get-VMNetworkAdapter -All
  - ps: Get-NetAdapter
  - ps: |
      $ipv4 = (Test-Connection -ComputerName $env:ComputerName -Count 1).IPV4Address.IPAddressToString
      Set-Item -path env:HOST_IP -value $ipv4
  - ipconfig
  - echo %HOST_IP%
  - docker build -t stefanscherer/registry-windows -f resources/dockerfiles/windows/registry/Dockerfile resources/dockerfiles/windows/registry
  - docker run -d -p 5000:5000 --restart=always --name registry stefanscherer/registry-windows
  - ps: |
      $ErrorActionPreference = 'Stop'
      function Invoke-DockerWithRetry {
        param([string[]] $DockerArguments)

        # Windows PowerShell does not throw on native nonzero exit codes.
        # Allow native stderr through and check LASTEXITCODE explicitly.
        $ErrorActionPreference = 'Continue'
        $delay = 2
        for ($attempt = 1; $attempt -le 5; $attempt++) {
          Write-Host "Docker attempt $attempt/5: docker $($DockerArguments -join ' ')"
          & docker @DockerArguments
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) { return }
          if ($attempt -eq 5) {
            throw "docker $($DockerArguments -join ' ') failed with exit code $exitCode after 5 attempts"
          }
          Write-Host "Exit code $exitCode; retrying in $delay seconds"
          Start-Sleep -Seconds $delay
          $delay = [Math]::Min($delay * 2, 30)
        }
      }

      $images = @(
        @('hello-world:nanoserver-sac2016', 'localhost:5000/hello-world:nanoserver'),
        @('nanoserver/iis', 'localhost:5000/nanoserver/iis'),
        @('mcr.microsoft.com/windows/nanoserver@sha256:8f78a4a7da4464973a5cd239732626141aec97e69ba3e4023357628630bc1ee2', 'localhost:5000/microsoft/nanoserver')
      )
      foreach ($image in $images) {
        Invoke-DockerWithRetry -DockerArguments @('pull', $image[0])
        docker tag $image[0] $image[1]
        if ($LASTEXITCODE -ne 0) { throw "Failed to tag $($image[0]) as $($image[1])" }
        Invoke-DockerWithRetry -DockerArguments @('push', $image[1])
      }
  - cargo build --features buildkit,chrono --verbose

test_script:
  - ps: Set-Item -path env:RUST_BACKTRACE -value 1
  - ps: Set-Item -path env:RUST_LOG -value "hyper=trace,bollard=debug"
  - ps: Set-Item -path env:REGISTRY_HTTP_ADDR -value localhost:5000
  - cargo test --features buildkit_providerless,chrono --lib -- --nocapture --test-threads 1
  - cargo test --verbose --tests -- --nocapture --test-threads 1
  - ps: Set-Item -path env:DOCKER_HOST -value npipe:////./pipe/docker_engine
  - cargo test --verbose --tests -- --nocapture --test-threads 1 --test test_connect_with_defaults
