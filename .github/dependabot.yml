version: 2
updates:
  # CI-only Go oracle: no routine version PRs, grouped security updates.
  # Bump deliberately with the BuildKit provenance pin and goldens.
  - package-ecosystem: "gomod"
    directory: "/codegen/llb-parity"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      go-oracle-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Generator updates need matching provenance expectations and regeneration.
      # See codegen/proto/README.md#upgrading-the-generator-toolchain.
      buildkit-generator-toolchain:
        patterns:
          - "protoc-bin-vendored"
          - "tonic-prost-build"
          - "prost-build"
  - package-ecosystem: "cargo"
    directory: "/codegen/swagger"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "maven"
    directory: "/codegen/swagger"
    schedule:
      interval: "weekly"
