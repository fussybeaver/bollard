version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      buildkit-generator-toolchain:
        patterns:
          - "protoc-bin-vendored"
          - "tonic-prost-build"
          - "prost-build"
  - package-ecosystem: "cargo"
    directory: "/codegen/swagger"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "maven"
    directory: "/codegen/swagger"
    schedule:
      interval: "weekly"
